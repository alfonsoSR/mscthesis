[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "tastro"
version = "0.1.0"
description = ""
authors = [
    { name = "Alfonso Sánchez Rodríguez", email = "a.sanchezrodriguez@student.tudelft.nl" }
]
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "numpydoc",
    "sphinx_design",
    "pydata-sphinx-theme",
    "sphinx-favicon",
    "sphinx-autoapi",
    "sphinx-design"
]

[tool.setuptools.packages.find]
where = [
    "src"
]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = false
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

[project.scripts]
compare_propagations = "tastro.analysis.propagation.cli:compare_propagation_results_cli"
# drsw_ephemerides = "tastro.analysis.propagation.cli:propagation_residual_wrt_ephemerides_rsw_cli"
# dj2000_ephemerides = "tastro.analysis.propagation.cli:propagation_residual_wrt_ephemerides_j2000_cli"
tsimulator = "tastro.analysis.runner.cli:runner_cli"
# tprefit = "tastro.analysis.runner.cli:calculate_prefit_residuals_cli"
# doppler_prefits = "tastro.analysis.estimation.cli:show_doppler_prefit_residuals_cli"
cartesian_residuals = "tastro.analysis.estimation.cli:show_cartesian_residuals_cli"
# doppler_residuals = "tastro.analysis.estimation.cli:show_doppler_residuals_cli"
fixed_integrator_analysis = "tastro.analysis.misc.cli:compare_fixed_step_integrators_cli"
estimation_summary = "tastro.analysis.estimation.cli:show_estimation_summary_cli"
doppler_estimation_results = "tastro.analysis.estimation.cli:show_doppler_estimation_results_cli"
# dest_rsw_ephemerides = "tastro.analysis.estimation.cli:estimated_orbit_vs_ephemerides_rsw_cli"
# dest_j2000_ephemerides = "tastro.analysis.estimation.cli:estimated_orbit_vs_ephemerides_j2000_cli"

tpropagator = "tastro.analysis.runners.cli:tpropagator_cli"
testimator = "tastro.analysis.runners.cli:testimator_cli"
tprefit = "tastro.analysis.runners.cli:tprefit_cli"

doppler_prefits = "tastro.analysis.plotters.cli:doppler_prefits"
doppler_prefits_distribution = "tastro.analysis.plotters.cli:doppler_prefits_distribution"
delta_doppler_prefits = "tastro.analysis.plotters.cli:delta_doppler_prefits"

doppler_postfits = "tastro.analysis.plotters.cli:doppler_postfits"
doppler_postfits_distribution = "tastro.analysis.plotters.cli:doppler_postfits_distribution"
delta_doppler_postfits = "tastro.analysis.plotters.cli:delta_doppler_postfits"
doppler_postfits_history = "tastro.analysis.plotters.cli:doppler_postfits_history"

doppler_residuals = "tastro.analysis.plotters.cli:doppler_residuals"
doppler_residuals_distribution = "tastro.analysis.plotters.cli:doppler_residuals_distribution"
delta_doppler_residuals = "tastro.analysis.plotters.cli:delta_doppler_residuals"

state_residuals = "tastro.analysis.plotters.cli:state_residuals"
state_formal_errors = "tastro.analysis.plotters.cli:state_formal_errors"
delta_state_residuals = "tastro.analysis.plotters.cli:delta_state_residuals"

correlation = "tastro.analysis.plotters.cli:correlation_matrix"
absolute_correlation = "tastro.analysis.plotters.cli:absolute_correlation_matrix"
anticorrelation = "tastro.analysis.plotters.cli:anticorrelation_matrix"
delta_correlation = "tastro.analysis.plotters.cli:delta_correlation_matrix"
delta_absolute_correlation = "tastro.analysis.plotters.cli:delta_absolute_correlation_matrix"
relative_delta_absolute_correlation = "tastro.analysis.plotters.cli:relative_difference_absolute_correlation"
